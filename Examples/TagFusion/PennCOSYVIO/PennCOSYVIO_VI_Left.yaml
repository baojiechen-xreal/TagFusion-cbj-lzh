%YAML:1.0

#--------------------------------------------------------------------------------------------
# PennCOSYVIO VI-Sensor Left camera (PinHole)
# Intrinsics from official dataset page:
#   K = [fx=445.80, fy=445.15, cx=371.50, cy=237.33]
#   k1=-0.03671, k2=0.05260  (no tangential distortion)
# Image size of extracted left_cam_frames: 752 x 480, ~20 FPS
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 445.80
Camera1.fy: 445.15
Camera1.cx: 371.50
Camera1.cy: 237.33

Camera1.k1: -0.03671
Camera1.k2: 0.05260
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

Camera.width: 752
Camera.height: 480

# Camera frames per second (timestamps_cameras.txt uses 0.05 s step)
# Must be integer (Settings::readParameter<int>)
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
# Viewer.enable: overrides the System ctor arg when set; formerly on by default
Viewer.enable: 1
# Former defaults KeyFrameSize=0.05, CameraSize=0.08 (normalized scale); shrink under metric Tags
Viewer.KeyFrameSize: 0.01
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.015
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
Viewer.showTagMap: 1
Viewer.showTagKFs: 0

System.saveOnlinePose: 1
System.saveOnlinePoseFile: "OnlineCameraTrajectory.txt"

#--------------------------------------------------------------------------------------------
# Tag Parameters  (backend: Thirdparty/apriltag ethz_apriltag2)
#--------------------------------------------------------------------------------------------
Tag.family: "tag36h11"
Tag.hamming: 2
Tag.black_border: 1
# PennCOSYVIO tags are printed on letter-size paper; adjust if your measured black-square side differs
Tag.size: 0.16
Tag.clahe: 1
Tag.clahe_clip_limit: 2.0
Tag.clahe_tile_grid: 8
Tag.verbose: 1
Tag.export: 1
Tag.export_dir: "tag_export_penncosyvio"
Tag.viewer: 1

# ========================== local BA ==========================
Tag.pose_optimization: 1   # shared by visual PoseOptimization and inertial PoseInertial* (only the active-sensor branch runs)
Tag.corner_sigma: 2.0
Tag.min_inlier_corners: 3
Tag.fixed_only: 1
Tag.local_ba.enable: 1
Tag.local_ba.optimize_active: 1
Tag.local_ba.corner_sigma: 2.0
Tag.local_ba.min_inlier_corners: 3
Tag.local_ba.verbose: 1

# ========================== adaptive corner-factor weights ==========================
Tag.factor_weight.enable: 0
Tag.factor_weight.alpha: 3.0          # base Tag / feature weight ratio
Tag.factor_weight.s_sat: 400.0        # area for full weight, px^2
Tag.factor_weight.lambda_s: 3.0
Tag.factor_weight.theta0_deg: 60.0    # view-angle scale
Tag.factor_weight.lambda_theta: 1.0
Tag.factor_weight.phi0_deg: 15.0      # significant IPPE two-fold rotation gap
Tag.factor_weight.e0: 1.0             # two-fold residual separation scale, px
Tag.factor_weight.lambda_amb: 0.0         # 0=disable the ambiguity term (w_amb stays 1)
Tag.factor_weight.w_min: 0.001
Tag.factor_weight.verbose: 0          # 1=print S, theta, delta-phi, delta-e and per-term weights

# ========================== loop closure ==========================
Tag.loop.enable: 1
Tag.loop.min_history_observations: 2
Tag.loop.min_keyframe_gap: 30 # minimum id gap between the historical loop KF and the current KF
Tag.loop.min_reobservation_gap_kfs: 30 # gap since the last valid observation; too small means continuously visible, not a reobservation
Tag.loop.min_historical_kf_map_points: 20 # historical KF must have at least this many tracked map points
Tag.loop.max_ippe_reprojection_error: 5.0 # IPPE reprojection-error threshold
Tag.loop.max_stereo_translation_error: 0.20 # left/right camera translation-difference threshold
Tag.loop.max_stereo_rotation_error: 0.20 # left/right camera rotation-difference threshold
Tag.loop.max_roll_pitch_correction: 0.15 # roll/pitch correction threshold of the Sim3 update
Tag.loop.max_yaw_correction: 1.57 # yaw correction threshold of the Sim3 update
Tag.loop.min_consistent_tags: 1 # minimum number of consistent tags required to accept a loop
Tag.loop.reference_timeout_kfs: 4 # drop the frozen loop reference after this many KFs without seeing the tag
Tag.loop.verbose: 1
