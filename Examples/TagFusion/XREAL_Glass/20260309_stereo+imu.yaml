%YAML:1.0

#--------------------------------------------------------------------------------------------
# XREAL Glass cam0+cam1+imu0 — TagFusion stereo-inertial
# Dataset: /home/geneta/dataset/01-1
# Capture date: 0309
# Device: q3fl / Flora (SN G419X00029)
#
# Path layout（compatible with stereo_inertial_xreal_glass_tag path search）:
#   /home/geneta/dataset/01-1
#   /home/geneta/dataset/01-1/raw_data/glass
#   /home/geneta/dataset/01-1/raw_data/glass/cam0/images
#
# Resolved as:
#   .../raw_data/glass/cam0/images  +  .../raw_data/glass/cam1/images
#   .../raw_data/glass/imu0.txt
#   timestamps.txt: "m0000000.pgm <t>"（same names on left and right）
#   imu0.txt: "<t> <temp> gx gy gz ax ay az"  （rad/s, m/s^2）
#
# Intrinsics / extrinsics from:
#   /home/geneta/dataset/01-1/ground_truth/calib/calib.yaml
# Camera.model: fisheye624 → ORB-SLAM3 KannalaBrandt8 approximated with kc[0:4]
# Stereo.T_c1_c2 built from cam0_q_cam1 (Hamilton qx,qy,qz,qw) + cam0_p_cam1
# IMU.T_b_c1 built from cam0 imu_q_cam / imu_p_cam (body = imu0)
# Resolution (W x H): 480 x 640  （different from the 20260807 640x512 setup; do not reuse 20260807_stereo+imu.yaml）
# Camera FPS: ~30（adjacent timestamps are about 0.0333s）
# IMU: imu.txt measured ~1000 Hz
#
# This sequence stores imu.txt; the runner looks for imu0.txt. Before running:
#   ln -sfn imu.txt /home/geneta/dataset/01-1/raw_data/glass/imu0.txt
#
# IMU bias: calib.yaml has acc_bias / gyr_bias, but the ORB-SLAM3 yaml has no matching fields.
# They are estimated from zero in InitializeIMU and cannot be written into this file.
#
# Run:
#   SETTINGS=./20260309_stereo+imu.yaml ./run_xreal_glass_stereo_inertial.sh \
#     /home/geneta/dataset/01-1/raw_data/glass
#--------------------------------------------------------------------------------------------

File.version: "1.0"

System.saveOnlinePose: 1
System.saveOnlinePoseFile: "OnlineCameraTrajectory.txt"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Left = cam0
Camera1.fx: 241.0209490280
Camera1.fy: 240.9424632976
Camera1.cx: 240.8256390183
Camera1.cy: 319.6359278925

Camera1.k1: -0.003999640788335217
Camera1.k2:  0.10009937073421979
Camera1.k3: -0.13197089574785664
Camera1.k4:  0.07716569306087023

# Right = cam1
Camera2.fx: 241.2937502711
Camera2.fy: 241.4851901712
Camera2.cx: 234.8491384237
Camera2.cy: 315.7306957409

Camera2.k1: -0.0015098833214587098
Camera2.k2:  0.09298398624857022
Camera2.k3: -0.12572225589036104
Camera2.k4:  0.07537319959131224

Camera.width: 480
Camera.height: 640

# adjacent timestamps are about 0.03333s
Camera.fps: 30

Camera.RGB: 1

Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 479
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 479

Stereo.ThDepth: 40.0

# T_c1_c2：cam1 pose in the cam0 frame; baseline about 0.1373 m
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.989259308384651, -0.014312871010946,  0.145468768117925,  0.136960463166922,
           0.013968840437630,  0.999896697221662,  0.003386204665872,  0.000526778398291,
          -0.145502207100617, -0.001317804475312,  0.989357049360954, -0.009714496382301,
           0.0, 0.0, 0.0, 1.0]

#--------------------------------------------------------------------------------------------
# IMU Parameters  （body = imu0; T_b_c1 from calib.yaml cam0 imu_q_cam / imu_p_cam）
# imu.txt measured about 1000 Hz (mean dt=0.001s)
# Noise matches calib.yaml imu_noises:
#   [gyro_sigma, gyro_walk, accel_sigma, accel_walk]
#--------------------------------------------------------------------------------------------
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.997116815425034,  0.007553953569625, -0.075504928197483, -0.048973817123984,
           0.001750159468464,  0.992478577415167,  0.122405924341110,  0.005619821030884,
           0.075861672394392, -0.122185151133166,  0.989603857866415,  0.012261787605074,
           0.0, 0.0, 0.0, 1.0]

IMU.NoiseGyro: 3.5e-04
IMU.NoiseAcc: 6.67e-03
IMU.GyroWalk: 1.0e-05
IMU.AccWalk: 6.8e-04
IMU.Frequency: 1000.0
IMU.InsertKFsWhenLost: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
# Offline serial mode does not start the Pangolin viewer thread; Viewer.enable and the 3D parameters below are ignored.
# Use Tag.show_in_orb_viewer below for the image window (main-thread cv::imshow; slower only, serial order unchanged).
#--------------------------------------------------------------------------------------------
Viewer.enable: 1
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.5
Viewer.ViewpointZ: -1.2
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
Viewer.showTagMap: 1
Viewer.showTagKFs: 1

#--------------------------------------------------------------------------------------------
# Tag Parameters
#--------------------------------------------------------------------------------------------
Tag.enable: 1                   # 0=disable the whole tag module (no detection, mapping, optimization, or tag-based KF insertion)
Tag.family: "tag36h11"
Tag.hamming: 2
# scan each blackBorder and merge by id (standard print=1, wider black border=2)
Tag.black_borders: [2]
Tag.size: 0.06                  # default side length in meters; ids not listed in size_by_id use this
Tag.gamma_enable: 1             # 0=no gamma before AprilTag; 1=apply Tag.gamma
Tag.gamma: 0.5                  # out=255*(in/255)^gamma；<1 brightens dark regions. CLAHE is disabled
Tag.verbose: 1
Tag.export: 1
Tag.export_dir: "tag_export"
Tag.viewer: 0                   # ignored in offline mode (TagViewer thread is not started)
Tag.save_vis: 0                 # 1=save a detection image every frame (including zero detections / gamma) to Tag.save_vis_dir
Tag.save_vis_dir: "tag_vis"     # relative path is from the runtime cwd (run_*.sh cds here)
Tag.show_in_orb_viewer: 1       # 1=main-thread imshow: Current Frame (ORB+Tag) + Tag Detect; Pangolin stays off

# ========================== local BA ==========================
Tag.pose_optimization: 1   # shared by visual PoseOptimization and inertial PoseInertial* (only the active-sensor branch runs)
Tag.corner_sigma: 2.0
Tag.min_inlier_corners: 3
Tag.fixed_only: 0
Tag.local_ba.enable: 1
Tag.local_ba.optimize_active: 1
Tag.local_ba.corner_sigma: 2.0
Tag.local_ba.min_inlier_corners: 3
Tag.local_ba.verbose: 1

# ========================== adaptive corner-factor weights ==========================
Tag.factor_weight.enable: 1
Tag.factor_weight.alpha: 3.0          # base Tag / feature weight ratio
Tag.factor_weight.s_sat: 400.0        # area for full weight, px^2
Tag.factor_weight.lambda_s: 3.0
Tag.factor_weight.theta0_deg: 60.0    # view-angle scale
Tag.factor_weight.lambda_theta: 1.0
Tag.factor_weight.phi0_deg: 15.0      # significant IPPE two-fold rotation gap
Tag.factor_weight.e0: 1.0             # two-fold residual separation scale, px
Tag.factor_weight.lambda_amb: 0.0         # 0=disable the ambiguity term (w_amb stays 1)
Tag.factor_weight.w_min: 0.001
Tag.factor_weight.verbose: 1          # 1=print S, theta, delta-phi, delta-e and per-term weights

# ========================== loop closure ==========================
Tag.loop.enable: 1
Tag.loop.min_history_observations: 2
Tag.loop.min_keyframe_gap: 30 # minimum id gap between the historical loop KF and the current KF
Tag.loop.min_reobservation_gap_kfs: 30 # gap since the last valid observation; too small means continuously visible, not a reobservation
Tag.loop.min_historical_kf_map_points: 20 # historical KF must have at least this many tracked map points
Tag.loop.max_ippe_reprojection_error: 5.0 # IPPE reprojection-error threshold
Tag.loop.max_stereo_translation_error: 0.20 # left/right camera translation-difference threshold
Tag.loop.max_stereo_rotation_error: 0.20 # left/right camera rotation-difference threshold
Tag.loop.max_roll_pitch_correction: 0.30 # roll/pitch correction threshold of the Sim3 update
Tag.loop.max_yaw_correction: 1.57 # yaw correction threshold of the Sim3 update
Tag.loop.min_consistent_tags: 1 # minimum number of consistent tags required to accept a loop
Tag.loop.reference_timeout_kfs: 4 # drop the frozen loop reference after this many KFs without seeing the tag
Tag.loop.verbose: 1
