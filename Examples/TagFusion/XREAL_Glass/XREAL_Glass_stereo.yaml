%YAML:1.0

#--------------------------------------------------------------------------------------------
# XREAL Glass cam0+cam1 (room-patrol) — TagFusion stereo
# Dataset example:
#   /home/geneta/dataset/20260227-room-patrol-11-1/raw_data/glass/cam0/images
#   /home/geneta/dataset/20260227-room-patrol-11-1/raw_data/glass/cam1/images
#   images: m0000000.pgm ... + timestamps.txt (same names and timestamps on left and right)
# Resolution (W x H): 480 x 640
#
# NOTE: glass_config uses fisheye624 (kc has 12 coeffs).
#       ORB-SLAM3 uses KannalaBrandt8 (k1..k4); Camera1 is an existing equivalent fit,
#       Camera2 approximates glass_config device_2 kc[0:4].
# Stereo.T_c1_c2 is derived from glass_config imu_T_cam (JPL qx,qy,qz,qw):
#   T_c1_c2 = inv(T_i_c1) * T_i_c2, baseline ~0.137 m
#--------------------------------------------------------------------------------------------

File.version: "1.0"

# After tracking OK, append one TUM line per frame: t tx ty tz qx qy qz qw (camera Twc)
System.saveOnlinePose: 1
System.saveOnlinePoseFile: "OnlineCameraTrajectory.txt"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Left = cam0 / device_1
Camera1.fx: 240.7419863233
Camera1.fy: 240.7144386986
Camera1.cx: 242.1941637626
Camera1.cy: 319.6862062347

Camera1.k1: -0.00125597
Camera1.k2:  0.08114141
Camera1.k3: -0.08559616
Camera1.k4:  0.02660804

# Right = cam1 / device_2
Camera2.fx: 240.9836483777
Camera2.fy: 241.2057072203
Camera2.cx: 234.6025171495
Camera2.cy: 315.5065436685

# glass_config device_2 kc[0:4] approximation (not full fisheye624)
Camera2.k1: -0.0018835397644940066
Camera2.k2:  0.09290193304828773
Camera2.k3: -0.12533434828731227
Camera2.k4:  0.07503848461787668

Camera.width: 480
Camera.height: 640

# ~30 Hz (adjacent timestamps.txt interval ~0.033s); Settings requires an integer
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. Ignored if grayscale)
Camera.RGB: 1

# Fisheye stereo-match overlapping column range (full width)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 479
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 479

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# T_c1_c2: right camera (cam1) pose in the left camera (cam0) frame
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.989881988738552, -0.009585580736115,  0.141568940848478,  0.137027285747399,
          0.009269173718980,  0.999952851658752,  0.002894283693308,  0.000227494681073,
         -0.141590009497760, -0.001552772192368,  0.989924167857792, -0.009280938608079,
          0.0, 0.0, 0.0, 1.0]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters (ORB Pangolin)
#--------------------------------------------------------------------------------------------
# Enable built-in ORB viewer (1=on, 0=off; overrides System ctor arg bUseViewer when set)
Viewer.enable: 1
# Sizes share the map scale. Former defaults (normalized scale, medianDepth≈1):
#   KeyFrameSize=0.05, CameraSize=0.08
# With metric Tags and a short baseline (~1-2 cm), frustums near the baseline length look wrongly scaled; shrink further
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.5
Viewer.ViewpointZ: -1.2
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
# Overlay TagMap (boxes/axes) in the ORB map; Show Tag KFs draws Tag-init keyframe frustums
Viewer.showTagMap: 1
Viewer.showTagKFs: 1

#--------------------------------------------------------------------------------------------
# Tag Parameters  (backend: Thirdparty/apriltag ethz_apriltag2)
#--------------------------------------------------------------------------------------------
Tag.family: "tag36h11"          # tag36h11/tag36h9/tag25h9/tag25h7/tag16h5
Tag.hamming: 2                  # max accepted hammingDistance (try 2 for recall; tighten to 1 for a real run)
Tag.black_border: 2             # ethz TagDetector blackBorder; printed tag36h11 is usually 1
Tag.size: 0.06                  # tag side length (m), used by IPPE
Tag.gamma: 1.0                  # <1 brightens dark regions; 1=off
Tag.verbose: 1
Tag.export: 1                  # 1=export; calibration writes the initial map, Shutdown writes final Tag+ORB
Tag.export_dir: "tag_export"   # init CSV + orb_final_*.csv / *_final_keyframes_tum.txt / final_map.ply
Tag.viewer: 0
Tag.save_vis: 0                 # 1=save a Tag detection image every frame to Tag.save_vis_dir
Tag.save_vis_dir: "tag_vis"
Tag.show_in_orb_viewer: 1       # 1=overlay Tags on ORB Current Frame; stereo shown left|right

# ========================== local BA ==========================
Tag.pose_optimization: 1   # shared by visual PoseOptimization and inertial PoseInertial* (only the active-sensor branch runs)
Tag.corner_sigma: 2.0
Tag.min_inlier_corners: 3
Tag.fixed_only: 0
Tag.local_ba.enable: 1
Tag.local_ba.optimize_active: 1
Tag.local_ba.corner_sigma: 2.0
Tag.local_ba.min_inlier_corners: 3
Tag.local_ba.verbose: 1

# ========================== adaptive corner-factor weights ==========================
Tag.factor_weight.enable: 0
Tag.factor_weight.alpha: 3.0          # base Tag / feature weight ratio
Tag.factor_weight.s_sat: 400.0        # area for full weight, px^2
Tag.factor_weight.lambda_s: 3.0
Tag.factor_weight.theta0_deg: 60.0    # view-angle scale
Tag.factor_weight.lambda_theta: 1.0
Tag.factor_weight.phi0_deg: 15.0      # significant IPPE two-fold rotation gap
Tag.factor_weight.e0: 1.0             # two-fold residual separation scale, px
Tag.factor_weight.lambda_amb: 0.0         # 0=disable the ambiguity term (w_amb stays 1)
Tag.factor_weight.w_min: 0.001
Tag.factor_weight.verbose: 0          # 1=print S, theta, delta-phi, delta-e and per-term weights

# ========================== loop closure ==========================
Tag.loop.enable: 1
Tag.loop.min_history_observations: 2
Tag.loop.min_keyframe_gap: 30 # minimum id gap between the historical loop KF and the current KF
Tag.loop.min_reobservation_gap_kfs: 30 # gap since the last valid observation; too small means continuously visible, not a reobservation
Tag.loop.min_historical_kf_map_points: 20 # historical KF must have at least this many tracked map points
Tag.loop.max_ippe_reprojection_error: 5.0 # IPPE reprojection-error threshold
Tag.loop.max_stereo_translation_error: 0.20 # left/right camera translation-difference threshold
Tag.loop.max_stereo_rotation_error: 0.20 # left/right camera rotation-difference threshold
Tag.loop.max_roll_pitch_correction: 0.15 # roll/pitch correction threshold of the Sim3 update
Tag.loop.max_yaw_correction: 1.57 # yaw correction threshold of the Sim3 update
Tag.loop.min_consistent_tags: 1 # minimum number of consistent tags required to accept a loop
Tag.loop.reference_timeout_kfs: 4 # drop the frozen loop reference after this many KFs without seeing the tag
Tag.loop.verbose: 1
